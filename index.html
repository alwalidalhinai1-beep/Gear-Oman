1:['PlayStation 5','With 2 controllers and 2 games'],
9:['PlayStation 5 Digital','No disc drive, with 1 controller'],
2:['Xbox Series X','With controller and Game Pass'],
10:['Xbox Series S','With controller and Game Pass'],

};
function nm(x){return LANG==='en'&&EN[x.id]?EN[x.id][0]:x.n}
function ds(x){return LANG==='en'&&EN[x.id]?EN[x.id][1]:x.d}
var DEP={1:20,9:18,2:20,10:15,3:15,4:5,11:5,12:8,5:30,6:6,7:10,8:15};
var CATS=['الكل','أجهزة','أجهزة تحكم','واقع افتراضي','ملحقات','للبيع'];
var st={q:'',tab:'shop',cat:'الكل',cart:{},days:{},bookings:[]};
try{var b=localStorage.getItem('gear-bookings');if(b)st.bookings=JSON.parse(b)}catch(e){}
function save(){try{localStorage.setItem('gear-bookings',JSON.stringify(st.bookings))}catch(e){}}
var $=function(s){return document.querySelector(s)};
function item(id){return ITEMS.filter(function(x){return x.id==id})[0]}
function reserved(id){var n=0;st.bookings.forEach(function(b){if(b.status==='active'||(item(id).c==='للبيع'&&b.status!=='cancelled'))b.lines.forEach(function(l){if(l.id==id)n+=l.q})});return n}
function avail(id){return item(id).s-reserved(id)}
function total(){var t=0,q=0,g=0;for(var id in st.cart){t+=st.cart[id]*item(id).p*(item(id).c==='للبيع'?1:(st.days[id]||1));q+=st.cart[id];g+=st.cart[id]*(DEP[id]||0)}return{t:t,q:q,g:g}}
function toast(m){var e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
function tab(t){st.tab=t;['shop','cart','book'].forEach(function(k){$('#t-'+k).setAttribute('aria-selected',k===t)});render()}
function add(id){var a=avail(id),c=st.cart[id]||0;if(c>=a)return toast(T().noMore);st.cart[id]=c+1;st.days[id]=st.days[id]||1;render()}
function chg(id,d){var c=(st.cart[id]||0)+d;if(c<=0)delete st.cart[id];else if(c<=avail(id))st.cart[id]=c;render()}
function dys(id,d){st.days[id]=Math.max(1,Math.min(30,(st.days[id]||1)+d));render()}
function closeIntro(){var i=$('#intro');if(!i)return;i.classList.add('out');document.body.style.overflow='';try{sessionStorage.setItem('gear-intro','1')}catch(e){}setTimeout(function(){i.hidden=true},500)}
function applyLang(){
var t=T();CUR=t.cur;
var h=document.documentElement;h.lang=LANG;h.dir=LANG==='en'?'ltr':'rtl';
document.title=t.title;
var md=document.querySelector('meta[name=description]');if(md)md.setAttribute('content',t.desc);
var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
set('sub',t.sub);set('l-shop',t.shop);set('l-cart',t.cart);set('l-book',t.book);set('ctitle',t.ct);set('cwa',t.wa);set('go',t.go);set('lang',t.langBtn);set('lang2',t.langBtn);set('isub',t.sub);set('enter',t.enter);
var l=$('#lang');if(l)l.setAttribute('aria-label',t.langLbl);
var q=$('#q');q.placeholder=t.ph;q.setAttribute('aria-label',t.ph);
var w=$('#wa');if(w)w.setAttribute('aria-label',t.waAria);
var tl=$('#ctel'),cw=$('#cwa');if(tl)tl.href='tel:+'+waNum();if(cw)cw.href='https://wa.me/'+waNum()+'?text='+encodeURIComponent(t.inq);
if(w)w.href='https://wa.me/'+waNum()+'?text='+encodeURIComponent(t.inq2);
render()}
function render(){
var t=T(),T_=total(),h='';
$('#sr').hidden=st.tab!=='shop';
$('#bar').hidden=!(st.tab==='shop'&&T_.q);
$('#bc').textContent=t.items(T_.q);$('#bt').textContent=(T_.t+T_.g)+' '+CUR;
if(st.tab==='shop'){
h+='<div class="chips">'+CATS.map(function(c){return '<button class="chip'+(c===st.cat?' on':'')+'" data-cat="'+c+'">'+t.cats[c]+'</button>'}).join('')+'</div><div class="grid">';
var ql=st.q.toLowerCase();
var L=ITEMS.filter(function(x){return (st.cat==='الكل'||x.c===st.cat)&&(x.n+' '+x.d+' '+x.c+' '+(EN[x.id]?EN[x.id].join(' '):'')+' '+S.en.cats[x.c]).toLowerCase().indexOf(ql)>-1});
if(!L.length)h+='<div class="empty" style="grid-column:1/-1">'+t.none(esc(st.q))+'</div>';
L.forEach(function(x){
var a=avail(x.id),sale=x.c==='للبيع';
h+='<div class="card"><div class="ico">'+x.i+'</div><h3>'+nm(x)+'</h3><small>'+ds(x)+'</small><div class="row" style="margin-top:6px"><div class="price">'+x.p+' <em>'+CUR+(sale?'':t.perDay)+'</em></div></div>'+(sale?'<small style="color:var(--ac2)">'+t.sale+'</small>':'<small>'+t.dep+DEP[x.id]+' '+CUR+'</small>')+'<div class="row" style="margin-top:6px"><small>'+(a>0?t.av+a:t.na)+'</small><button class="btn" data-add="'+x.id+'"'+(a<1||(st.cart[x.id]||0)>=a?' disabled':'')+'>'+t.add+(st.cart[x.id]?' ('+st.cart[x.id]+')':'')+'</button></div></div>'});
h+='</div>'}
if(st.tab==='cart'){
var ids=Object.keys(st.cart);
if(!ids.length)h='<div class="empty">'+t.emptyCart+'</div>';
else{
h+='<div class="ticket">';
ids.forEach(function(id){var x=item(id),sale=x.c==='للبيع';
h+='<div class="line"><div><b>'+x.i+' '+nm(x)+'</b><br><small>'+x.p+' '+CUR+(sale?' · '+t.sale:t.perDay)+'</small></div><div><div class="step">'+t.qty+' <button data-q="'+id+'" data-d="-1" aria-label="'+t.dec+'">−</button>'+st.cart[id]+'<button data-q="'+id+'" data-d="1" aria-label="'+t.inc+'">+</button></div>'+(sale?'':'<br><div class="step">'+t.days+' <button data-y="'+id+'" data-d="-1" aria-label="'+t.dec+'">−</button>'+st.days[id]+'<button data-y="'+id+'" data-d="1" aria-label="'+t.inc+'">+</button></div>')+'</div></div>'});
h+='<hr><div class="line"><span>'+t.rent+'</span><span>'+T_.t+' '+CUR+'</span></div><div class="line"><span>'+t.depR+'</span><span>'+T_.g+' '+CUR+'</span></div><div class="row"><b>'+t.due+'</b><span class="tot">'+(T_.t+T_.g)+' '+CUR+'</span></div><small style="color:var(--mu)">'+t.note+'</small></div>';
var d=new Date().toISOString().slice(0,10);
h+='<div class="ticket"><b>'+t.det+'</b><label for="nm">'+t.nm+'</label><input id="nm" autocomplete="name"><label for="ph">'+t.phn+'</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel"><label for="dt">'+t.dt+'</label><input id="dt" type="date" min="'+d+'" value="'+d+'"><br><br><button class="btn" id="conf" style="width:100%">'+t.conf+'</button></div>'}}
if(st.tab==='book'){
if(!st.bookings.length)h='<div class="empty">'+t.nob+'</div>';
st.bookings.slice().reverse().forEach(function(b){
h+='<div class="ticket"><div class="row"><b>'+esc(b.name)+'</b><span class="tag'+(b.status!=='active'?' done':'')+'">'+(t.st[b.status]||t.st.cancelled)+'</span></div><small>'+esc(b.phone)+' · '+t.pick+b.date+'</small><hr>';
b.lines.forEach(function(l){var x=item(l.id);h+='<div class="line"><span>'+x.i+' '+nm(x)+' × '+l.q+'</span><span>'+(x.c==='للبيع'?t.buy:t.dayN(l.days))+'</span></div>'});
h+='<hr><div class="line"><span>'+t.rent+'</span><span>'+b.total+' '+CUR+'</span></div><div class="line"><span>'+t.depo+'</span><span>'+(b.dep||0)+' '+CUR+'</span></div><div class="row" style="flex-wrap:wrap"><b>'+(b.total+(b.dep||0))+' '+CUR+'</b>'+(b.status==='active'?'<span><button class="btn ghost" data-wa="'+b.ref+'">'+t.sendWa+'</button> <button class="btn ghost" data-can="'+b.ref+'">'+t.can+'</button></span>':'')+'</div>'+(b.status==='active'?'<div class="rnote">'+t.retNote+' <a href="https://wa.me/'+waNum()+'?text='+encodeURIComponent(t.retMsg+String(b.ref).slice(-6))+'" target="_blank" rel="noopener">'+t.retWa+'</a></div>':'')+'</div>'});}
$('#app').innerHTML=h}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
document.addEventListener('click',function(e){
var t=e.target.closest('button');if(!t)return;
if(t.id==='enter')closeIntro();
else if(t.id==='lang'||t.id==='lang2'){LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('gear-lang',LANG)}catch(e){}applyLang()}
else if(t.id==='t-shop')tab('shop');else if(t.id==='t-cart')tab('cart');else if(t.id==='t-book')tab('book');
else if(t.id==='go')tab('cart');
else if(t.dataset.cat){st.cat=t.dataset.cat;render()}
else if(t.dataset.add)add(t.dataset.add);
else if(t.dataset.q)chg(t.dataset.q,+t.dataset.d);
else if(t.dataset.y)dys(t.dataset.y,+t.dataset.d);
else if(t.dataset.ret||t.dataset.can||t.dataset.dmg){var r=t.dataset.ret||t.dataset.can||t.dataset.dmg;st.bookings.forEach(function(b){if(b.ref==r){if(t.dataset.can&&b.status!=='cancelled'){mailSend(b,1);pushCancel(b)}b.status=t.dataset.ret?'returned':t.dataset.dmg?'damaged':'cancelled'}});save();render()}
else if(t.id==='conf'){
var n=$('#nm').value.trim(),p=$('#ph').value.trim();
if(!n||p.length<7)return toast(T().bad);
var lines=Object.keys(st.cart).map(function(id){return{id:+id,q:st.cart[id],days:st.days[id]}});
var nb={ref:Date.now(),name:n,phone:p,date:$('#dt').value,lines:lines,total:total().t,dep:total().g,status:'active'};
st.bookings.push(nb);
st.cart={};st.days={};save();pushSend(nb);mailSend(nb);waSend(nb);toast(T().ok);tab('book')}
else if(t.dataset.wa){st.bookings.forEach(function(b){if(b.ref==t.dataset.wa)waSend(b)})}
});
$('#q').addEventListener('input',function(e){st.q=e.target.value.trim();render()});
applyLang();
if(SEEN){$('#intro').hidden=true}else{document.body.style.overflow='hidden';setTimeout(function(){var g=$('#enter');if(g)g.focus()},50)}
</script>
</body>
